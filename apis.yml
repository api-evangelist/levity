aid: levity
name: Levity
description: Levity (Levity AI GmbH, Berlin, Germany) is a Communication Intelligence platform for the
  global supply chain, delivering AI automation for freight operations on top of the systems logistics
  teams already run rather than replacing them. It turns the email and phone traffic that drives day-to-day
  freight work - quoting, order entry, track-and-trace, document processing and carrier communication,
  in any language - into structured, automated workflows with humans kept in the loop. The platform pairs
  inbox analytics (a control tower over millions of emails), an AI automation flow builder, human-in-the-loop
  review and a feedback loop that turns operator corrections into continuous model improvement. Levity
  integrates with named TMS platforms including CargoWise, MercuryGate, Descartes, SAP and Oracle, plus
  custom, in-house and legacy systems. Levity reports 100M+ emails processed and 5M+ working hours saved,
  serving customers such as ECU Worldwide, Gebrueder Weiss, DPD, LKW Walter and FitzMark across North
  America and DACH. Levity is backed by Balderton Capital. Levity publishes no public self-serve API,
  developer portal or SDKs - the product is sold and onboarded through sales - but it does publish an
  llms.txt, a status page, a trust center and a security program.
